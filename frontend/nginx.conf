server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Real 404 for dotfiles and typical scanner targets (instead of the SPA fallback)
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(sql|pem|key|env|bak|old|log|ya?ml|toml|ini|config|npmrc|htpasswd)$ { return 404; }
    location ~* ^/(web\.config|credentials\.json|appsettings.*\.json|config\.js|env\.js|firebase.*\.js|id_rsa)$ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
